<a class="skip-link" href="#main-content">Skip to production line</a>
<header class="app-header">
  <a class="brand" routerLink="/overview" aria-label="Bühler production line overview">
    <ui-logo />
  </a>
  <div class="header-details">
    <div class="clock">
      <app-material-icon name="schedule" />
      <time [attr.datetime]="timestamp()">{{ now() | date: 'dd.MM.yyyy HH:mm' }}</time>
    </div>
    <div class="operator">
      <app-material-icon name="account_circle" />
      <span>Operator</span>
    </div>
  </div>
</header>
<main id="main-content" tabindex="-1">
  <router-outlet />
</main>
